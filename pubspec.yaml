name: weather_app
description: A modern weather application built with Flutter and MVVM architecture.
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # HTTP client
  dio: ^5.7.0

  # JSON serialization
  json_annotation: ^4.9.0

  # Local storage
  shared_preferences: ^2.3.3

  # Location services
  geolocator: ^13.0.2

  # Environment variables
  flutter_dotenv: ^5.2.1

  # Google Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - .env
